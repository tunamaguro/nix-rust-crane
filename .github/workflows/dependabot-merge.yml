name: Merge Dependabot minor candidate

on:
  workflow_run:
    workflows:
      - Dependabot minor candidate
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Download candidate metadata
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dependabot-minor-candidate
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          candidate_file="candidate/candidate.json"
          jq -e '
            (.pr_number | type == "number") and
            (.head_sha | type == "string") and
            (.update_type == "version-update:semver-minor")
          ' "$candidate_file" >/dev/null

          pr_number="$(jq -r '.pr_number' "$candidate_file")"
          head_sha="$(jq -r '.head_sha' "$candidate_file")"

          [[ "$pr_number" =~ ^[0-9]+$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          [[ "$(jq -r '.user.login' <<<"$pr_json")" == 'dependabot[bot]' ]]
          [[ "$(jq -r '.state' <<<"$pr_json")" == 'open' ]]
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == 'main' ]]
          [[ "$(jq -r '.head.sha' <<<"$pr_json")" == "$head_sha" ]]

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow CI \
                --event pull_request \
                --commit "$HEAD_SHA" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"

            if [[ -n "$run_id" ]]; then
              break
            fi

            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            echo "No CI workflow run found for $HEAD_SHA" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Merge minor update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(jq -r '.head.sha' <<<"$pr_json")"
          current_state="$(jq -r '.state' <<<"$pr_json")"

          if [[ "$current_state" != 'open' || "$current_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "PR changed while waiting for CI; refusing to merge" >&2
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$EXPECTED_HEAD_SHA"
