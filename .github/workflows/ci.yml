name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.3

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check flake
        run: nix flake check --print-build-logs
